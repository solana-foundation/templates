  - '@next/*'
  - react
  - react-dom
  - '@solana/client'
  - '@solana/react-hooks'
  - '@solana/kit'
  - '@solana/kit-plugin-wallet'
  - '@solana-program/system'
  - '@solana-program/token'
  - '@solana-program/memo'
  - '@solana/web3.js'
  - '@solana/wallet-adapter'
  - '@solana/wallet-standard-util'
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - bigint-buffer
  - bufferutil
  - esbuild
  - sharp
  - unrs-resolver
  - utf-8-validate
overrides:
  'axios@>=1.0.0 <1.20.0': 1.20.0
  'basic-ftp@>=5.0.0 <5.3.1': 5.3.1
  '@drift-labs/sdk>uuid': 11.1.1
  '@grpc/grpc-js@>=1.14.0 <1.14.6': 1.14.6
  'handlebars@>=4.0.0 <4.7.9': 4.7.9
  'minimatch@>=9.0.0 <9.0.7': 9.0.9
  'nanoid@>=3.0.0 <3.3.18': 3.3.20
  'postcss@>=8.0.0 <8.5.23': 8.5.31
  'protobufjs@>=7.0.0 <7.6.5': 7.6.5
  'tar@>=6.0.0 <=7.5.18': 7.5.22
  'toml@<5.0.1': 5.0.1
  'vitest@>=3.0.0 <3.2.6': 3.2.7
  'ws@>=8.0.0 <8.21.0': 8.22.0
  'zod@>=4.0.0 <4.6.6': 4.6.7
packages:
