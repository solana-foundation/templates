minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - next
  - '@next/*'
  - react
  - react-dom
  - '@solana/client'
  - '@solana/react-hooks'
  - '@solana/kit'
  - '@solana/kit-plugin-wallet'
  - '@solana-program/system'
  - '@solana-program/token'
  - '@solana-program/memo'
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - bigint-buffer
  - bufferutil
  - esbuild
  - sharp
  - unrs-resolver
  - utf-8-validate
overrides:
  'basic-ftp@>=5.0.0 <5.3.1': 5.3.1
  'handlebars@>=4.0.0 <4.7.9': 4.7.9
  'protobufjs@>=7.0.0 <7.6.5': 7.6.5
  'tar@>=6.0.0 <=7.5.18': 7.5.22
  'vitest@>=3.0.0 <3.2.6': 3.2.7
packages:
  - community/*
  - kit/*
  - pinocchio/*
  - web3js/*
