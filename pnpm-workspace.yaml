allowBuilds:
  '@parcel/watcher': set this to true or false
  '@stellar/stellar-sdk': set this to true or false
  bigint-buffer: set this to true or false
  blake-hash: set this to true or false
  bufferutil: set this to true or false
  esbuild: set this to true or false
  keccak: set this to true or false
  protobufjs: set this to true or false
  puppeteer: set this to true or false
  sharp: set this to true or false
  sqlite3: set this to true or false
  tiny-secp256k1: set this to true or false
  unrs-resolver: set this to true or false
  usb: set this to true or false
  utf-8-validate: set this to true or false
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - next
  - '@next/*'
  - react
  - react-dom
  - '@solana/client'
  - '@solana/react-hooks'
  - '@solana/kit'
  - '@solana/kit-plugin-wallet'
  - '@solana-program/system'
  - '@solana-program/token'
  - '@solana-program/memo'
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - bigint-buffer
  - bufferutil
  - esbuild
  - sharp
  - unrs-resolver
  - utf-8-validate
packages:
  - community/*
  - kit/*
  - pinocchio/*
  - web3js/*
