name: 'Setup Environment'
description: 'Sets up the environment for testing by installing dependencies and configuring git.'
inputs:
  node-version:
    description: 'The Node.js version to use.'
    required: true
  package-manager:
    description: 'The package manager to use.'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Cache Cargo and AVM
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          ~/.avm/
        key: ${{ runner.os }}-cargo-avm-1.1.2

    - name: Install AVM
      run: |
        if ! command -v avm &> /dev/null; then
          cargo install --git https://github.com/solana-foundation/anchor avm --locked --force
        fi
      shell: bash

    - name: Install Anchor via AVM
      run: |
        avm install 1.1.2
        avm use 1.1.2
        echo "$HOME/.avm/bin" >> $GITHUB_PATH
      shell: bash

    - name: Install Solana CLI
      run: |
        AGAVE_DIR="$RUNNER_TEMP/agave-4.2.2"
        rm -rf "$AGAVE_DIR"
        mkdir -p "$AGAVE_DIR"
        curl --fail --silent --show-error --location \
          https://github.com/anza-xyz/agave/releases/download/v4.2.2/solana-release-x86_64-unknown-linux-gnu.tar.bz2 \
          | tar -xjf - --strip-components=1 -C "$AGAVE_DIR"
        echo "SOLANA_BIN=$AGAVE_DIR/bin" >> $GITHUB_ENV
        echo "SOLANA_TEST_VALIDATOR=$AGAVE_DIR/bin/solana-test-validator" >> $GITHUB_ENV
        echo "$AGAVE_DIR/bin" >> $GITHUB_PATH
      shell: bash

    - name: Verify installations
      run: |
        anchor --version
        "$SOLANA_BIN/solana" --version
        "$SOLANA_TEST_VALIDATOR" --version
      shell: bash

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure Git identity
      run: |
        git config --global user.email "ci-bot@example.com"
        git config --global user.name "CI Bot"
      shell: bash

    - name: Install package manager
      if: ${{ inputs.package-manager == 'pnpm' }}
      run: npm install -g pnpm@12.7.0
      shell: bash

    - name: Install package manager
      if: ${{ inputs.package-manager == 'yarn' }}
      run: npm install -g yarn
      shell: bash
