[package]
name = "xark-starter-pinocchio"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
interface = { path = "../../interface" }
pinocchio = "0.11"
pinocchio-system = "0.6"
# Generated by `just build`.
secret-code-verifier = { path = "../../circuit/target/xark/secret_code/verifier" }

# PDA helpers for host builds; on-chain they use syscalls.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "2", features = ["curve25519"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(target_arch, values("bpf"))',
] }
